name: Test IGROgram server
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm install --package-lock-only
        working-directory: server
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
